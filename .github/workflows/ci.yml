name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch (offline tests run a tiny random-init NAFNet; no real weights are downloaded)
        run: python -m pip install --upgrade pip && python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the remaining pinned test dependencies
        run: python -m pip install numpy==2.5.3 pillow==11.3.0 safetensors==0.8.0 scikit-image==0.26.0 pytest==8.4.2 ruff==0.16.6
      - name: Install package without resolving dependencies again
        run: python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests tools
      - name: Unit, carrier and CPU pre-flight tests
        run: pytest
      - name: Validate tutorial, carrier, lock and model-card source
        run: python tools/validate_release_assets.py
      - name: Standalone notebook parity (NOTEBOOK_SPEC 2.2 PAR3)
        run: python tools/build_notebook.py --check

  release-evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain evidence boundary
        run: |
          echo "Static/unit CI is not clean-runtime notebook execution evidence (NOTEBOOK_SPEC REL8)."
          echo "CI never downloads the real checkpoint; see docs/release-verification.md before promoting the tutorial."
